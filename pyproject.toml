[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batsur-bracket-validator"
version = "0.1.4"
description = "Перевірка балансу дужок (), [], {}, <> з виділенням хибних позицій"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Arsen Batsur", email = "arsen.batsur.25@cnu.edu.ua" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
bracket-validator = "bracket_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
